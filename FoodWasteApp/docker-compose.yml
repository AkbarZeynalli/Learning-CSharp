version: '3.8'

services:
  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foodwaste-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - foodwaste-network

  # .NET Web API
  webapi:
    build:
      context: .
      dockerfile: FoodWasteApp.WebAPI/Dockerfile
    container_name: foodwaste-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=FoodWasteDB;
        User Id=sa;
        Password=Your_password123;
        TrustServerCertificate=True;
        MultipleActiveResultSets=true
    ports:
      - "5000:80"
    depends_on:
      - sqlserver
    networks:
      - foodwaste-network

volumes:
  sqlserver-data:

networks:
  foodwaste-network:
    driver: bridge
